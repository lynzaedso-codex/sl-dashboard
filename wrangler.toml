name = "sl-dashboard"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Non-secret config. Fill these in, then `wrangler deploy`.
[vars]
TELEGRAM_ALLOWED_CHAT_ID = "-5343409122"
# owner/repo of the GitHub repo running refresh-dashboard.yml — this Worker
# calls its repository_dispatch API to kick off a refresh, it never talks
# to Lark directly anymore (see scripts/build-and-publish.mjs instead).
GITHUB_REPO = "REPLACE_ME_GITHUB_OWNER/REPLACE_ME_GITHUB_REPO"

# Create with: wrangler kv namespace create DASHBOARD_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "DASHBOARD_KV"
id = "REPLACE_ME_KV_NAMESPACE_ID"

# Secrets — set with `wrangler secret put <NAME>`, never written here:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   WORKER_ADMIN_TOKEN
#   GITHUB_TOKEN       — a GitHub Personal Access Token (classic, "repo" scope)
#                         used only to call the repository_dispatch API on
#                         the repo above. LARK_APP_SECRET is NOT needed here
#                         anymore — it now lives as a GitHub Actions secret
#                         instead (see .github/workflows/refresh-dashboard.yml).
